aid: gorila
name: Gorila
description: >-
  Gorila is a Brazilian investment-technology company that consolidates,
  calculates, and reconciles investment portfolios across every custodian. Its
  developer product, GorilaCORE, is a B2B REST API that lets financial
  institutions, fintechs, brokerages, multi-family offices, and advisors build
  their own investment-consolidation and portfolio-analytics experiences:
  create portfolios, ingest transactions, and retrieve NAV, P&L, time-weighted
  return (TWR), and internal-rate-of-return (IRR) time series computed from
  millions of transactions across hundreds of thousands of products. Gorila is
  backed by Ribbit Capital.
